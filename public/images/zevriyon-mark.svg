<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 105" fill="none" role="img" aria-label="Zevriyon Mark">
  <defs>
    <linearGradient id="zev-mark-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2B4" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>
    <linearGradient id="zev-mark-arrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#00E5B9" />
    </linearGradient>
  </defs>

  <!-- Headset Headband -->
  <path d="M 16 52 A 38 38 0 0 1 84 52" fill="none" stroke="#0E1C2F" stroke-width="7.5" stroke-linecap="round" />
  
  <!-- Left Ear Cup -->
  <rect x="8" y="44" width="11" height="26" rx="5.5" fill="#0E1C2F" />
  <!-- Right Ear Cup -->
  <rect x="81" y="44" width="11" height="26" rx="5.5" fill="#0E1C2F" />
  
  <!-- Mic Boom -->
  <path d="M 87 62 C 87 85 66 95 48 95" fill="none" stroke="#0E1C2F" stroke-width="5.5" stroke-linecap="round" />
  <rect x="40" y="90" width="16" height="10" rx="5" fill="#0E1C2F" />

  <!-- Wifi Signals -->
  <path d="M 33 27 A 22 22 0 0 1 67 27" fill="none" stroke="url(#zev-mark-cyan)" stroke-width="4.8" stroke-linecap="round" />
  <path d="M 39 35 A 14 14 0 0 1 61 35" fill="none" stroke="url(#zev-mark-cyan)" stroke-width="4.4" stroke-linecap="round" />
  <circle cx="50" cy="42" r="3.4" fill="url(#zev-mark-cyan)" />

  <!-- Growth Trend Arrow -->
  <path d="M 27 75 L 42 58 L 52 68 L 74 42" fill="none" stroke="url(#zev-mark-arrow)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 64 42 L 76 40 L 76 52 Z" fill="#00D2B4" />
</svg>
